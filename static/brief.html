<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Brief - NORPLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="output-view" class="view active">
            <button id="home-back-btn" class="header-icon" aria-label="Go Back">
                <img src="Norpleface.svg" alt="Back">
            </button>

            <div class="brief-container">
                <h2>Project Brief</h2>
                <div class="share-link">
                    <input type="text" id="share-url" readonly>
                    <button id="copy-btn">Copy Link</button>
                </div>
                
                <div class="brief-section">
                    <h3>Summary</h3>
                    <p id="out-summary"></p>
                </div>
                
                <div class="brief-section">
                    <h3>Goals & Success Criteria</h3>
                    <ul id="out-goals"></ul>
                </div>

                <div class="brief-section">
                    <h3>Missing / Unclear Information</h3>
                    <ul id="out-missing"></ul>
                </div>

                <div class="brief-section">
                    <h3>Suggested Follow-up Questions</h3>
                    <ul id="out-followups"></ul>
                </div>
                <div class="confirmation-section" style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
    <button id="confirm-btn" style="background-color: #111; color: white; padding: 16px 40px; border-radius: 50px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        I Confirm This Brief
    </button>
</div>
            </div>
        </section>
    </div>
    <script src="brief.js"></script> 
</body>
</html>
