<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORPLE by Softworks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="landing-view" class="view active">
            <div class="landing-content">
                <p class="subtitle">I N T R O D U C I N G</p>
                <img src="NORPLE.svg" alt="NORPLE" class="main-logo">
                <div class="powered-by">
                    <p>P O W E R E D &nbsp; B Y</p>
                    <img src="Softworks.png" alt="Softworks" class="softworks-logo">
                </div>
                <button id="get-started-btn" class="primary-btn">GET STARTED</button>
            </div>
        </section>

        <section id="input-view" class="view hidden">
            <button id="back-btn" class="header-icon" aria-label="Go Back">
                <img src="Norpleface.svg" alt="Back">
            </button>
            
            <div class="input-container">
                <div class="character-illustration">
                    <img src="Norplesitting.png" alt="Norple Sitting" class="norple-sit">
                </div>

                <form id="brief-form">
                    <input type="text" id="text-input" name="text_input" placeholder="Let Norple Help You" class="main-input">
                    
                    <div class="upload-area">
                        <label class="upload-box">
                            <input type="file" name="files" multiple accept="image/*,audio/*,.pdf">
                            <span class="upload-text">ATTACH HERE</span>
                            <span class="upload-limit">200MB per file</span>
                        </label>
                        <label class="upload-box">
                            <input type="file" name="files" multiple accept="image/*,audio/*,.pdf">
                            <span class="upload-text">ATTACH HERE</span>
                            <span class="upload-limit">200MB per file</span>
                        </label>
                         <label class="upload-box">
                            <input type="file" name="files" multiple accept="image/*,audio/*,.pdf">
                            <span class="upload-text">ATTACH HERE</span>
                            <span class="upload-limit">200MB per file</span>
                        </label>
                        <button type="submit" class="submit-plus" id="submit-btn">+</button>
                    </div>
                </form>
                <div id="loading" class="hidden">Norple is thinking...</div>
            </div>
        </section>

        <section id="output-view" class="view hidden">
            <div class="brief-container">
                <h2>Project Brief</h2>
                <div class="share-link">
                    <input type="text" id="share-url" readonly>
                    <button id="copy-btn">Copy Link</button>
                </div>
                
                <div class="brief-section">
                    <h3>Summary</h3>
                    <p id="out-summary"></p>
                </div>
                
                <div class="brief-section">
                    <h3>Goals & Success Criteria</h3>
                    <ul id="out-goals"></ul>
                </div>

                <div class="brief-section">
                    <h3>Missing / Unclear Information</h3>
                    <ul id="out-missing"></ul>
                </div>

                <div class="brief-section">
                    <h3>Suggested Follow-up Questions</h3>
                    <ul id="out-followups"></ul>
                </div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
